name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test-and-build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: swift --version
      - name: Unit tests
        run: ./scripts/test.sh
      - name: Release app bundle
        run: ./scripts/build-app.sh
      - name: Verify bundle
        run: |
          codesign --verify --verbose dist/Tapr.app
          plutil -lint dist/Tapr.app/Contents/Info.plist
          # No motion sensor on a runner: the probe must exit 1 cleanly, never crash.
          ./dist/Tapr.app/Contents/MacOS/Tapr --probe; test $? -le 1
      - name: Log analysis script syntax
        run: python3 -m py_compile scripts/analyze-log.py
      - uses: actions/upload-artifact@v4
        with:
          name: Tapr.app
          path: dist/Tapr.app
          if-no-files-found: error
